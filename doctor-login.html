<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1000px;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .login-left {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: #fff;
            min-height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .doctor-icon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .doctor-icon i {
            font-size: 50px;
        }

        .login-left h2 {
            font-weight: 700;
        }

        .login-left p {
            opacity: 0.9;
            line-height: 1.7;
        }

        .login-right {
            background: #fff;
            min-height: 550px;
            padding: 55px 50px;
            display: flex;
            align-items: center;
        }

        .login-content {
            width: 100%;
        }

        .login-title {
            font-weight: 700;
            color: #212529;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .input-group-text {
            background: #fff;
            border-right: 0;
            color: #0d6efd;
        }

        .form-control {
            border-left: 0;
            padding: 12px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #dee2e6;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 0.15rem rgba(13, 110, 253, 0.15);
            border-radius: 6px;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #86b7fe;
        }

        .login-btn {
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
        }

        .forgot-link {
            text-decoration: none;
            font-size: 14px;
        }

        .back-link {
            text-decoration: none;
            color: #6c757d;
            font-size: 14px;
        }

        .back-link:hover,
        .forgot-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 767px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-left {
                min-height: auto;
                padding: 35px 20px;
            }

            .login-left p {
                margin-bottom: 0;
            }

            .login-right {
                min-height: auto;
                padding: 40px 25px;
            }

            .login-card {
                border-radius: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container login-wrapper">

    <div class="card login-card">

        <div class="row g-0">

            <!-- LEFT SIDE -->
            <div class="col-md-5">

                <div class="login-left">

                    <div>

                        <div class="doctor-icon">
                            <i class="bi bi-person-badge"></i>
                        </div>

                        <h2>Doctor Portal</h2>

                        <p>
                            Manage appointments, patients, consultations,
                            prescriptions and follow-ups from one place.
                        </p>

                        <div class="mt-4">
                            <i class="bi bi-shield-check me-2"></i>
                            Secure Doctor Access
                        </div>

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="col-md-7">

                <div class="login-right">

                    <div class="login-content">

                        <h3 class="login-title">
                            Doctor Login
                        </h3>

                        <p class="login-subtitle">
                            Sign in to access your dashboard
                        </p>


                        <!-- LOGIN FORM -->
                        <form id="doctorLoginForm">

                            <!-- Doctor ID / Email -->
                            <div class="mb-3">

                                <label for="doctorId" class="form-label">
                                    Doctor ID / Email
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="doctorId"
                                        placeholder="Enter Doctor ID or Email"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Enter your password"
                                        required
                                    >

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>

                                </div>

                            </div>


                            <!-- Remember / Forgot -->
                            <div class="d-flex justify-content-between align-items-center mb-4">

                               

                                <a href="#" class="forgot-link">
                                    Forgot Password?
                                </a>

                            </div>


                            <!-- Login Button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100 login-btn"
                            >
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Login
                            </button>

                        </form>


                        <!-- Back -->
                        <div class="text-center mt-4">

                            <a href="index.html" class="back-link">
                                <i class="bi bi-arrow-left me-1"></i>
                                Back to Home
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>

    // Show / Hide Password
    document.getElementById("togglePassword").addEventListener("click", function () {

        const password = document.getElementById("password");
        const icon = this.querySelector("i");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");

        }

    });


    // Login
    document.getElementById("doctorLoginForm").addEventListener("submit", function (event) {

        event.preventDefault();

        const doctorId = document.getElementById("doctorId").value;
        const password = document.getElementById("password").value;

        if (doctorId === "" || password === "") {
            alert("Please enter Doctor ID and Password.");
            return;
        }

     
        alert("Login button clicked.");

    });

</script>

</body>
</html>
